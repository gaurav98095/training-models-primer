<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
  <title id="title">Repeated multipliers can shrink or grow a gradient</title>
  <desc id="desc">A gradient multiplied by 0.5 repeatedly shrinks from 1 to 0.03125 after five stages. A gradient multiplied by 1.5 grows from 1 to 7.59375 after five stages.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#1b2430"/><stop offset="1" stop-color="#202b38"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7fa7a7"/></marker></defs>
  <rect width="1400" height="470" rx="28" fill="url(#bg)"/>
  <text x="70" y="58" fill="#e4e7e8" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">The chain rule can shrink or amplify a signal</text>
  <text x="70" y="90" fill="#aeb8bc" font-family="Inter,Arial,sans-serif" font-size="17">These scalar examples isolate the mechanism; real networks use matrix Jacobians and nonlinearities.</text>
  <g font-family="Inter,Arial,sans-serif"><text x="80" y="145" fill="#9bb9b1" font-size="20" font-weight="700">Vanishing: multiply by 0.5</text><text x="80" y="175" fill="#b0bcc0" font-size="16">1 → 0.5 → 0.25 → 0.125 → 0.0625 → 0.03125</text><text x="80" y="205" fill="#b59a69" font-size="16">After 20 stages: 0.5²⁰ ≈ 0.000000954</text>
  <text x="80" y="300" fill="#b59a69" font-size="20" font-weight="700">Exploding: multiply by 1.5</text><text x="80" y="330" fill="#b0bcc0" font-size="16">1 → 1.5 → 2.25 → 3.375 → 5.0625 → 7.59375</text><text x="80" y="360" fill="#a9876d" font-size="16">After 20 stages: 1.5²⁰ ≈ 3325</text></g>
  <g transform="translate(800 128)"><g fill="#789b93" stroke="#a6c3bc" stroke-width="2"><circle cx="0" cy="45" r="21"/><circle cx="115" cy="45" r="16"/><circle cx="230" cy="45" r="12"/><circle cx="345" cy="45" r="9"/><circle cx="460" cy="45" r="7"/><circle cx="575" cy="45" r="5"/></g><g stroke="#7fa7a7" stroke-width="3" marker-end="url(#arrow)"><path d="M25 45 H95"/><path d="M132 45 H210"/><path d="M244 45 H330"/><path d="M357 45 H445"/><path d="M472 45 H560"/></g><g fill="#a9876d" stroke="#d0bd91" stroke-width="2"><circle cx="0" cy="245" r="8"/><circle cx="115" cy="245" r="11"/><circle cx="230" cy="245" r="15"/><circle cx="345" cy="245" r="20"/><circle cx="460" cy="245" r="27"/><circle cx="575" cy="245" r="36"/></g><g stroke="#b59a69" stroke-width="3" marker-end="url(#arrow)"><path d="M25 245 H95"/><path d="M132 245 H210"/><path d="M244 245 H330"/><path d="M357 245 H445"/><path d="M472 245 H560"/></g><text x="288" y="120" fill="#b0bcc0" font-size="16" text-anchor="middle">backward stages</text><text x="288" y="330" fill="#b0bcc0" font-size="16" text-anchor="middle">backward stages</text></g>
</svg>
