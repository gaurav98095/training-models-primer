<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="450" viewBox="0 0 1400 450" role="img" aria-labelledby="title desc">
  <title id="title">Learning rate changes the trajectory of gradient descent</title>
  <desc id="desc">For the loss L equals w minus 5 squared, a learning rate of 0.1 converges smoothly, 0.5 reaches the minimum quickly, 1.0 oscillates, and 1.2 diverges.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#1b2430"/><stop offset="1" stop-color="#202b38"/></linearGradient></defs>
  <rect width="1400" height="450" rx="28" fill="url(#bg)"/>
  <text x="70" y="58" fill="#e4e7e8" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Learning rate changes the whole trajectory</text>
  <text x="70" y="90" fill="#aeb8bc" font-family="Inter,Arial,sans-serif" font-size="17">All four runs start at w = 0 for L = (w − 5)²; only η changes.</text>
  <g transform="translate(100 125)"><path d="M0 245 H820 M55 275 V10" fill="none" stroke="#65737d" stroke-width="2"/><path d="M55 220 C170 175 230 115 330 85 C425 58 570 43 810 34" fill="none" stroke="#7fa7a0" stroke-width="4"/><path d="M55 220 L420 34" fill="none" stroke="#b59a69" stroke-width="4"/><path d="M55 220 L810 220" fill="none" stroke="#a57dff" stroke-width="4" stroke-dasharray="12 10"/><path d="M55 220 C190 45 285 330 390 54 C510 320 610 10 810 350" fill="none" stroke="#a9876d" stroke-width="4"/><line x1="55" y1="34" x2="810" y2="34" stroke="#7fa7a7" stroke-width="2" stroke-dasharray="5 6"/><text x="50" y="300" fill="#aeb8bc" font-family="Inter,Arial,sans-serif" font-size="15">step</text><text x="10" y="24" fill="#aeb8bc" font-family="Inter,Arial,sans-serif" font-size="15">weight</text><text x="700" y="25" fill="#a6c3bc" font-family="ui-monospace,monospace" font-size="17">η = 0.1</text><text x="700" y="70" fill="#d0bd91" font-family="ui-monospace,monospace" font-size="17">η = 0.5</text><text x="700" y="215" fill="#dfcaff" font-family="ui-monospace,monospace" font-size="17">η = 1.0</text><text x="700" y="335" fill="#c2ab91" font-family="ui-monospace,monospace" font-size="17">η = 1.2</text></g>
  <g transform="translate(1000 150)" font-family="Inter,Arial,sans-serif"><rect width="300" height="180" rx="20" fill="#2a3741" stroke="#53636e" stroke-width="2"/><text x="28" y="45" fill="#e4e7e8" font-size="20" font-weight="700">Interpretation</text><text x="28" y="87" fill="#a6c3bc" font-size="17">small η → slow but stable</text><text x="28" y="119" fill="#d0bd91" font-size="17">moderate η → fast convergence</text><text x="28" y="151" fill="#c2ab91" font-size="17">large η → overshoot or diverge</text></g>
</svg>
