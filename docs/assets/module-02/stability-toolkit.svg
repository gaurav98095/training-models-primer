<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
  <title id="title">Tools that improve gradient flow and training stability</title>
  <desc id="desc">Residual connections provide a direct path, normalization controls scale, initialization sets starting scale, warmup controls early steps, clipping limits spikes, and AdamW adapts updates.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#1b2430"/><stop offset="1" stop-color="#202b38"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7fa7a7"/></marker></defs>
  <rect width="1400" height="470" rx="28" fill="url(#bg)"/>
  <text x="70" y="58" fill="#e4e7e8" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">A stability toolkit, not a single magic fix</text>
  <text x="70" y="90" fill="#aeb8bc" font-family="Inter,Arial,sans-serif" font-size="17">Each technique acts on a different part of the forward, backward, or update process.</text>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(70 145)"><rect width="190" height="190" rx="18" fill="#263843" stroke="#628f96" stroke-width="2"/><text x="95" y="46" fill="#e4e7e8" font-size="18" font-weight="700">Residuals</text><path d="M35 105 H155 M35 140 H155 M35 105 C70 70 120 70 155 105" fill="none" stroke="#7fa7a0" stroke-width="5"/><text x="95" y="173" fill="#b8c5c9" font-size="14">direct gradient path</text></g>
    <g transform="translate(290 145)"><rect width="190" height="190" rx="18" fill="#3e4655" stroke="#8790a0" stroke-width="2"/><text x="95" y="46" fill="#e4e7e8" font-size="18" font-weight="700">Norms</text><path d="M40 125 Q95 55 150 125 M40 125 H150" fill="none" stroke="#a7b6ff" stroke-width="4"/><text x="95" y="173" fill="#c5c5ca" font-size="14">control activation scale</text></g>
    <g transform="translate(510 145)"><rect width="190" height="190" rx="18" fill="#454555" stroke="#ae82ff" stroke-width="2"/><text x="95" y="46" fill="#e4e7e8" font-size="18" font-weight="700">Initialization</text><path d="M40 130 L65 100 L90 120 L115 75 L140 105" fill="none" stroke="#b6aabd" stroke-width="4"/><text x="95" y="173" fill="#cfc3d0" font-size="14">set starting scale</text></g>
    <g transform="translate(730 145)"><rect width="190" height="190" rx="18" fill="#51463b" stroke="#ffc274" stroke-width="2"/><text x="95" y="46" fill="#e4e7e8" font-size="18" font-weight="700">Warmup</text><path d="M40 135 L150 65" fill="none" stroke="#b59a69" stroke-width="4"/><text x="95" y="173" fill="#c2ab91" font-size="14">gentle early updates</text></g>
    <g transform="translate(950 145)"><rect width="190" height="190" rx="18" fill="#51463b" stroke="#a9876d" stroke-width="2"/><text x="95" y="46" fill="#e4e7e8" font-size="18" font-weight="700">Clipping</text><path d="M40 125 L75 75 L115 125 L150 95" fill="none" stroke="#b99b84" stroke-width="4"/><line x1="40" y1="105" x2="150" y2="105" stroke="#c2ab91" stroke-width="2" stroke-dasharray="5 5"/><text x="95" y="173" fill="#c2ab91" font-size="14">limit extreme norms</text></g>
    <g transform="translate(1170 145)"><rect width="160" height="190" rx="18" fill="#2d4748" stroke="#65e8ca" stroke-width="2"/><text x="80" y="46" fill="#e4e7e8" font-size="18" font-weight="700">AdamW</text><circle cx="80" cy="100" r="32" fill="none" stroke="#9bb9b1" stroke-width="4"/><path d="M80 68 V100 L103 116" fill="none" stroke="#9bb9b1" stroke-width="4"/><text x="80" y="173" fill="#a6c3bc" font-size="14">adapt updates</text></g>
  </g>
  <text x="700" y="400" fill="#b59a69" font-family="Inter,Arial,sans-serif" font-size="17" text-anchor="middle">Diagnose first; choose the tool that addresses the observed failure mode.</text>
</svg>
