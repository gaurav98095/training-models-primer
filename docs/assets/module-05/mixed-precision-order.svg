<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Mixed precision clipping order</title><desc id="desc">The safe mixed precision sequence is scale the loss, backpropagate, unscale gradients, clip them, then take the optimizer step.</desc><rect width="900" height="520" fill="#17212b"/><g font-family="Inter,Arial,sans-serif" fill="#e7edf2"><text x="48" y="54" font-size="26" font-weight="700">Mixed-precision order matters</text><text x="48" y="82" fill="#aab8c4" font-size="16">Clip unscaled gradients; otherwise the threshold is measured in the wrong units.</text><g transform="translate(55 170)"><g fill="#243442" stroke="#526473" stroke-width="2"><rect x="0" y="0" width="135" height="90" rx="10"/><rect x="165" y="0" width="135" height="90" rx="10"/><rect x="330" y="0" width="135" height="90" rx="10"/><rect x="495" y="0" width="135" height="90" rx="10"/><rect x="660" y="0" width="135" height="90" rx="10"/></g><g font-size="17" text-anchor="middle"><text x="67" y="35">scale loss</text><text x="67" y="62" fill="#d3a85c">× S</text><text x="232" y="35">backward</text><text x="232" y="62" fill="#8fc3b5">scaled g</text><text x="397" y="35">unscale</text><text x="397" y="62" fill="#b5a6cf">g / S</text><text x="562" y="35">clip</text><text x="562" y="62" fill="#d3a85c">compare τ</text><text x="727" y="35">optimizer step</text><text x="727" y="62">update</text></g><g stroke="#8fc3b5" stroke-width="3"><path d="M135 45H165M300 45H330M465 45H495M630 45H660"/></g></g><rect x="220" y="340" width="460" height="62" rx="10" fill="#3a3030" stroke="#b97866" stroke-width="2"/><text x="450" y="378" text-anchor="middle" font-size="18">Never clip before unscale: τ would be scaled too.</text></g></svg>
