<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Gradient accumulation and clipping order</title><desc id="desc">Microbatch gradients are accumulated into one buffer, then the combined gradient is clipped once before the optimizer step.</desc><rect width="900" height="520" fill="#17212b"/><g font-family="Inter,Arial,sans-serif" fill="#e7edf2"><text x="48" y="54" font-size="26" font-weight="700">Accumulate first, clip once</text><text x="48" y="82" fill="#aab8c4" font-size="16">The clipping boundary should see the gradient used for the update.</text><g stroke="#526473" stroke-width="2" fill="#243442"><rect x="55" y="150" width="150" height="65" rx="10"/><rect x="55" y="250" width="150" height="65" rx="10"/><rect x="55" y="350" width="150" height="65" rx="10"/><rect x="350" y="225" width="210" height="115" rx="12"/><rect x="700" y="225" width="145" height="115" rx="12"/></g><g font-size="18"><text x="82" y="188">microbatch 1</text><text x="82" y="288">microbatch 2</text><text x="82" y="388">microbatch 3</text><text x="395" y="263">accumulated</text><text x="395" y="292" fill="#8fc3b5">g₁ + g₂ + g₃</text><text x="395" y="321" fill="#d3a85c">clip global norm</text><text x="720" y="263">optimizer</text><text x="720" y="292">one step</text></g><g stroke="#8fc3b5" stroke-width="3" fill="none"><path d="M205 182H300V282H350M205 282H350M205 382H300V282"/><path d="M560 282H700"/></g><path d="M688 273l12 9-12 9" fill="#8fc3b5"/><text x="610" y="355" fill="#b97866" font-size="15">not each microbatch</text></g></svg>
