<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Gradient norms compared with a clipping threshold</title><desc id="desc">A step chart shows mostly healthy gradient norms below a threshold and occasional spikes above it.</desc><rect width="900" height="520" fill="#17212b"/><g font-family="Inter,Arial,sans-serif" fill="#e7edf2"><text x="48" y="54" font-size="26" font-weight="700">How often does clipping trigger?</text><text x="48" y="82" fill="#aab8c4" font-size="16">A few spikes can be a safeguard; frequent crossings deserve investigation.</text><g transform="translate(92 125)"><path d="M0 310H720M0 0V310" stroke="#526473" stroke-width="2"/><path d="M0 122H720" stroke="#d3a85c" stroke-width="3" stroke-dasharray="9 8"/><text x="540" y="112" fill="#d3a85c" font-size="16">threshold τ</text><polyline points="0,235 45,220 90,244 135,210 180,231 225,218 270,130 315,230 360,214 405,95 450,225 495,235 540,205 585,225 630,52 675,226 720,215" fill="none" stroke="#8fc3b5" stroke-width="5"/><circle cx="270" cy="130" r="7" fill="#b97866"/><circle cx="405" cy="95" r="7" fill="#b97866"/><circle cx="630" cy="52" r="7" fill="#b97866"/><text x="0" y="342" fill="#aab8c4" font-size="15">training step</text><text x="-62" y="12" fill="#aab8c4" font-size="15" transform="rotate(-90 -62 12)">global norm</text><text x="22" y="372" fill="#8fc3b5" font-size="15">below τ: update unchanged</text><text x="390" y="372" fill="#b97866" font-size="15">above τ: update rescaled</text></g></g></svg>
