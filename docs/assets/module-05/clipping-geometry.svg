<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Gradient clipping preserves direction</title><desc id="desc">A gradient vector longer than the threshold is scaled down along the same ray, preserving direction while reducing magnitude.</desc><rect width="900" height="520" fill="#17212b"/><g font-family="Inter,Arial,sans-serif" fill="#e7edf2"><text x="48" y="54" font-size="26" font-weight="700">Clipping changes length, not direction</text><text x="48" y="82" fill="#aab8c4" font-size="16">For ‖g‖ &gt; τ, use g′ = g · τ / ‖g‖.</text><g transform="translate(120 390)"><path d="M0 0H290M0 0V-250" stroke="#526473" stroke-width="2"/><path d="M0 0L245-190" stroke="#b97866" stroke-width="8"/><path d="M0 0L145-113" stroke="#8fc3b5" stroke-width="8"/><path d="M245-190L145-113" stroke="#d3a85c" stroke-width="2" stroke-dasharray="7 7"/><text x="165" y="-185" fill="#b97866" font-size="17">original g</text><text x="66" y="-100" fill="#8fc3b5" font-size="17">clipped g′</text><text x="155" y="-128" fill="#d3a85c" font-size="15">same direction</text><text x="260" y="24" fill="#aab8c4" font-size="15">magnitude →</text></g><rect x="530" y="170" width="295" height="180" rx="12" fill="#243442" stroke="#526473" stroke-width="2"/><text x="560" y="210" font-size="19">Scale factor</text><text x="560" y="250" font-size="24" fill="#d3a85c">min(1, τ / ‖g‖)</text><text x="560" y="288" font-size="16" fill="#aab8c4">τ ≥ ‖g‖ → unchanged</text><text x="560" y="318" font-size="16" fill="#aab8c4">τ &lt; ‖g‖ → proportional shrink</text></g></svg>
