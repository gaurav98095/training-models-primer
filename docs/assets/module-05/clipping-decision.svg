<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Gradient clipping decision guide</title><desc id="desc">A decision path distinguishes occasional large norms, where clipping is a safeguard, from repeated or non-finite norms, which require investigation.</desc><rect width="900" height="520" fill="#17212b"/><g font-family="Inter,Arial,sans-serif" fill="#e7edf2"><text x="48" y="54" font-size="26" font-weight="700">Clipping: safeguard or signal?</text><text x="48" y="82" fill="#aab8c4" font-size="16">Use the pattern of events to decide whether to continue or debug.</text><rect x="330" y="125" width="240" height="65" rx="12" fill="#243442" stroke="#8fc3b5" stroke-width="2"/><text x="450" y="153" text-anchor="middle" font-size="18">Is ‖g‖ &gt; τ?</text><text x="450" y="177" text-anchor="middle" fill="#aab8c4" font-size="15">inspect frequency and finiteness</text><path d="M390 190V245M510 190V245" stroke="#8fc3b5" stroke-width="3"/><text x="360" y="224" fill="#8fc3b5" font-size="15">no</text><text x="520" y="224" fill="#d3a85c" font-size="15">yes</text><rect x="225" y="245" width="230" height="105" rx="12" fill="#243442" stroke="#8fc3b5" stroke-width="2"/><rect x="525" y="245" width="230" height="105" rx="12" fill="#243442" stroke="#d3a85c" stroke-width="2"/><text x="340" y="280" text-anchor="middle" font-size="18">Continue</text><text x="340" y="308" text-anchor="middle" fill="#aab8c4" font-size="15">update is unchanged</text><text x="340" y="332" text-anchor="middle" fill="#8fc3b5" font-size="15">normal path</text><text x="640" y="280" text-anchor="middle" font-size="18">How often?</text><text x="640" y="308" text-anchor="middle" fill="#d3a85c" font-size="15">occasional → safeguard</text><text x="640" y="332" text-anchor="middle" fill="#b97866" font-size="15">frequent/NaN → investigate</text><path d="M640 350V405" stroke="#b97866" stroke-width="3"/><rect x="525" y="405" width="230" height="55" rx="10" fill="#3a3030" stroke="#b97866" stroke-width="2"/><text x="640" y="439" text-anchor="middle" font-size="17">check data, loss, scale, LR</text></g></svg>
