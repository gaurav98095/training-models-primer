<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Momentum buffer combines current gradient with history</title><desc id="desc">A current gradient enters a weighted accumulator. The previous buffer is scaled by beta, the new gradient by one minus beta, and the resulting buffer produces the parameter update.</desc>
<rect width="900" height="430" fill="#17212b"/><g font-family="sans-serif" fill="#e7edf0" font-size="18"><rect x="45" y="160" width="180" height="85" rx="8" fill="#263541" stroke="#80b8b0" stroke-width="2"/><text x="83" y="195">current gradient</text><text x="99" y="223" fill="#9eabb5">gₜ</text><rect x="350" y="130" width="210" height="145" rx="8" fill="#263541" stroke="#b4a6d8" stroke-width="2"/><text x="395" y="175">momentum</text><text x="425" y="207" fill="#9eabb5">vₜ = βvₜ₋₁</text><text x="398" y="239" fill="#9eabb5">+ (1−β)gₜ</text><rect x="680" y="160" width="165" height="85" rx="8" fill="#263541" stroke="#d4a75c" stroke-width="2"/><text x="712" y="195">update</text><text x="717" y="223" fill="#9eabb5">θ ← θ − ηvₜ</text></g>
<g fill="none" stroke="#80b8b0" stroke-width="3" marker-end="url(#a)"><path d="M225 202H350"/><path d="M560 202H680"/></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#80b8b0"/></marker></defs><path d="M455 130V70H270V160" fill="none" stroke="#9eabb5" stroke-width="2" stroke-dasharray="6 5"/><text x="275" y="58" fill="#9eabb5" font-family="sans-serif" font-size="15">previous buffer vₜ₋₁ (history)</text></svg>
