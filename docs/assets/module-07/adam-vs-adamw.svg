<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">Adam versus AdamW weight decay</title><desc id="desc">Two parallel update paths compare coupled L2 regularization, where decay enters the gradient, with decoupled AdamW, where decay is applied directly to the parameter.</desc><rect width="900" height="440" fill="#17212b"/><g font-family="sans-serif" fill="#e7edf0"><text x="80" y="55" font-size="22" fill="#b4a6d8">Adam + L2 (coupled)</text><text x="80" y="250" font-size="22" fill="#d4a75c">AdamW (decoupled)</text><g fill="#263541" stroke-width="2"><rect x="70" y="90" width="180" height="65" rx="8" stroke="#80b8b0"/><rect x="350" y="90" width="210" height="65" rx="8" stroke="#bd7562"/><rect x="660" y="90" width="170" height="65" rx="8" stroke="#b4a6d8"/><rect x="70" y="285" width="180" height="65" rx="8" stroke="#80b8b0"/><rect x="350" y="285" width="210" height="65" rx="8" stroke="#d4a75c"/><rect x="660" y="285" width="170" height="65" rx="8" stroke="#b4a6d8"/></g><g text-anchor="middle" font-size="16"><text x="160" y="118">gradient g</text><text x="160" y="140" fill="#9eabb5">+ λθ</text><text x="455" y="118">optimizer sees</text><text x="455" y="140" fill="#9eabb5">regularized gradient</text><text x="745" y="118">adaptive update</text><text x="745" y="140" fill="#9eabb5">decay is mixed in</text><text x="160" y="313">gradient g</text><text x="160" y="335" fill="#9eabb5">unchanged</text><text x="455" y="313">Adam step</text><text x="455" y="335" fill="#9eabb5">then − ηλθ</text><text x="745" y="313">parameter update</text><text x="745" y="335" fill="#9eabb5">decay is separate</text></g></g><g stroke="#9eabb5" stroke-width="3" marker-end="url(#a)"><path d="M250 122H350M560 122H660M250 317H350M560 317H660"/></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#9eabb5"/></marker></defs></svg>
