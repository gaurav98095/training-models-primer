<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Adam tracks first and second gradient moments</title><desc id="desc">The Adam optimizer sends each gradient to two exponential moving averages: the first moment m tracks direction and the second moment v tracks squared-gradient scale.</desc>
<rect width="900" height="420" fill="#17212b"/><g fill="#263541" stroke-width="2"><rect x="55" y="160" width="150" height="75" rx="8" stroke="#80b8b0"/><rect x="365" y="75" width="200" height="90" rx="8" stroke="#b4a6d8"/><rect x="365" y="255" width="200" height="90" rx="8" stroke="#d4a75c"/><rect x="700" y="160" width="150" height="75" rx="8" stroke="#bd7562"/></g><g fill="#e7edf0" font-family="sans-serif" text-anchor="middle"><text x="130" y="193" font-size="20">gₜ</text><text x="130" y="218" font-size="14" fill="#9eabb5">gradient</text><text x="465" y="112" font-size="18">first moment mₜ</text><text x="465" y="138" font-size="14" fill="#9eabb5">direction / mean(g)</text><text x="465" y="292" font-size="18">second moment vₜ</text><text x="465" y="318" font-size="14" fill="#9eabb5">scale / mean(g²)</text><text x="775" y="193" font-size="18">adaptive step</text><text x="775" y="218" font-size="14" fill="#9eabb5">m / (√v + ε)</text></g><g fill="none" stroke-width="3" marker-end="url(#a)"><path d="M205 195H365" stroke="#80b8b0"/><path d="M205 195 C270 195 290 120 365 120" stroke="#b4a6d8"/><path d="M205 195 C270 195 290 300 365 300" stroke="#d4a75c"/><path d="M565 120 C625 120 635 190 700 195M565 300 C625 300 635 200 700 195" stroke="#9eabb5"/></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#9eabb5"/></marker></defs></svg>
