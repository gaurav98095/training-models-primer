<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Adam update sequence</title><desc id="desc">A left-to-right sequence shows gradient, moment updates, bias correction, and the final parameter update.</desc><rect width="1000" height="300" fill="#17212b"/>
<g font-family="sans-serif" text-anchor="middle"><g fill="#263541" stroke-width="2"><rect x="30" y="105" width="145" height="80" rx="8" stroke="#80b8b0"/><rect x="215" y="105" width="175" height="80" rx="8" stroke="#b4a6d8"/><rect x="430" y="105" width="175" height="80" rx="8" stroke="#d4a75c"/><rect x="645" y="105" width="145" height="80" rx="8" stroke="#bd7562"/><rect x="830" y="105" width="140" height="80" rx="8" stroke="#80b8b0"/></g><g fill="#e7edf0"><text x="102" y="138" font-size="19">gradient gₜ</text><text x="102" y="163" font-size="14" fill="#9eabb5">from loss</text><text x="302" y="138" font-size="18">moments</text><text x="302" y="163" font-size="14" fill="#9eabb5">mₜ, vₜ</text><text x="517" y="138" font-size="18">bias correction</text><text x="517" y="163" font-size="14" fill="#9eabb5">m̂ₜ, v̂ₜ</text><text x="717" y="138" font-size="18">normalize</text><text x="717" y="163" font-size="14" fill="#9eabb5">m̂ / (√v̂ + ε)</text><text x="900" y="138" font-size="18">θ update</text><text x="900" y="163" font-size="14" fill="#9eabb5">θ − η · step</text></g></g><g stroke="#9eabb5" stroke-width="3" marker-end="url(#a)"><path d="M175 145H215M390 145H430M605 145H645M790 145H830"/></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#9eabb5"/></marker></defs></svg>
