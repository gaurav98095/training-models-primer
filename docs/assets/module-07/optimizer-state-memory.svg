<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Optimizer state memory footprint</title><desc id="desc">A stacked memory diagram compares parameter memory, gradient memory, and optimizer state. SGD stores no extra moments, while Adam stores first and second moments, increasing memory.</desc><rect width="900" height="430" fill="#17212b"/><g font-family="sans-serif" fill="#e7edf0"><text x="90" y="48" font-size="21">per-parameter memory (illustrative)</text><text x="185" y="90" font-size="18" fill="#80b8b0">SGD</text><text x="575" y="90" font-size="18" fill="#b4a6d8">Adam / AdamW</text></g><g stroke="#17212b" stroke-width="3"><rect x="100" y="120" width="220" height="70" fill="#80b8b0"/><rect x="100" y="190" width="220" height="70" fill="#9eabb5"/><rect x="550" y="120" width="220" height="70" fill="#80b8b0"/><rect x="550" y="190" width="220" height="70" fill="#9eabb5"/><rect x="550" y="260" width="220" height="70" fill="#b4a6d8"/><rect x="550" y="330" width="220" height="70" fill="#d4a75c"/></g><g font-family="sans-serif" text-anchor="middle" font-size="16" fill="#17212b"><text x="210" y="161">parameters θ</text><text x="210" y="231">gradients g</text><text x="660" y="161">parameters θ</text><text x="660" y="231">gradients g</text><text x="660" y="301">first moment m</text><text x="660" y="371">second moment v</text></g><g font-family="sans-serif" fill="#9eabb5" font-size="14"><text x="100" y="415">SGD: θ + g (+ optional momentum buffer)</text><text x="550" y="415">Adam: θ + g + m + v</text></g></svg>
