<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Learning rate controls the per-step decay fraction</title>
  <desc id="desc">Two conceptual curves show that with fixed weight decay, the direct decay fraction per step follows the learning rate schedule.</desc>
  <rect width="960" height="430" fill="#17212b"/>
  <g font-family="sans-serif">
    <text x="52" y="48" fill="#e7edf0" font-size="25" font-weight="700">Weight decay and learning rate are coupled in time</text>
    <text x="52" y="76" fill="#9eabb5" font-size="16">For AdamW, direct shrinkage per step is ηₜλ, so a fixed λ follows the LR schedule.</text>
    <rect x="74" y="112" width="812" height="240" rx="10" fill="#1d2a34"/>
    <line x1="130" y1="306" x2="834" y2="306" stroke="#9eabb5" stroke-width="2"/>
    <line x1="130" y1="148" x2="130" y2="306" stroke="#9eabb5" stroke-width="2"/>
    <path d="M130 165H260L390 195L520 235L650 273L834 298" fill="none" stroke="#d4a75c" stroke-width="4"/>
    <path d="M130 180H260L390 210L520 250L650 284L834 302" fill="none" stroke="#80b8b0" stroke-width="3" stroke-dasharray="8 7"/>
    <g fill="#9eabb5" font-size="14"><text x="112" y="151" text-anchor="end">larger</text><text x="112" y="310" text-anchor="end">smaller</text><text x="130" y="333">early steps</text><text x="834" y="333" text-anchor="end">late steps</text></g>
    <text x="210" y="145" fill="#d4a75c" font-size="15">learning rate ηₜ</text>
    <text x="650" y="270" fill="#80b8b0" font-size="15">direct decay ηₜλ</text>
    <rect x="74" y="370" width="812" height="35" rx="8" fill="#263541"/>
    <text x="480" y="394" text-anchor="middle" fill="#e7edf0" font-size="16">Compare total decay across the schedule, not λ in isolation.</text>
  </g>
</svg>
