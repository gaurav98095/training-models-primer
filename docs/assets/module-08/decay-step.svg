<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">One AdamW weight-decay step</title>
  <desc id="desc">A scalar weight of 10 is shrunk by a factor of 0.99 when the learning rate and weight-decay coefficient are both 0.1.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#9eabb5"/></marker></defs>
  <rect width="960" height="390" fill="#17212b"/>
  <g font-family="sans-serif">
    <text x="52" y="48" fill="#e7edf0" font-size="25" font-weight="700">Decay is multiplicative</text>
    <text x="52" y="76" fill="#9eabb5" font-size="16">With no task gradient, AdamW still applies a direct shrinkage step.</text>
    <rect x="54" y="120" width="190" height="100" rx="12" fill="#263541" stroke="#80b8b0" stroke-width="2"/>
    <text x="149" y="153" text-anchor="middle" fill="#e7edf0" font-size="18">old weight</text>
    <text x="149" y="190" text-anchor="middle" fill="#80b8b0" font-size="31" font-weight="700">10.00</text>
    <path d="M244 170H323" stroke="#9eabb5" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="329" y="120" width="282" height="100" rx="12" fill="#263541" stroke="#d4a75c" stroke-width="2"/>
    <text x="470" y="153" text-anchor="middle" fill="#e7edf0" font-size="18">decay multiplier</text>
    <text x="470" y="190" text-anchor="middle" fill="#d4a75c" font-size="27" font-weight="700">1 − ηλ = 0.99</text>
    <path d="M611 170H690" stroke="#9eabb5" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="696" y="120" width="210" height="100" rx="12" fill="#263541" stroke="#b4a6d8" stroke-width="2"/>
    <text x="801" y="153" text-anchor="middle" fill="#e7edf0" font-size="18">after decay</text>
    <text x="801" y="190" text-anchor="middle" fill="#b4a6d8" font-size="31" font-weight="700">9.90</text>
    <rect x="54" y="270" width="852" height="60" rx="10" fill="#1d2a34"/>
    <text x="480" y="307" text-anchor="middle" fill="#e7edf0" font-size="19">θ ← (1 − ηλ)θ − η · update(g)</text>
  </g>
</svg>
