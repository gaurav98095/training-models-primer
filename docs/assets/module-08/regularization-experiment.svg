<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">How to read a weight-decay experiment</title>
  <desc id="desc">A three-panel conceptual chart compares training loss, validation loss, and parameter norm for no decay, moderate decay, and excessive decay.</desc>
  <rect width="960" height="430" fill="#17212b"/>
  <g font-family="sans-serif">
    <text x="52" y="48" fill="#e7edf0" font-size="25" font-weight="700">Read three signals together</text>
    <text x="52" y="76" fill="#9eabb5" font-size="16">The point of the experiment is diagnosis, not a guaranteed ordering of curves.</text>
    <g transform="translate(46 110)">
      <rect width="270" height="228" rx="10" fill="#1d2a34"/><text x="18" y="28" fill="#e7edf0" font-size="17">training loss</text>
      <line x1="38" y1="190" x2="242" y2="190" stroke="#536371"/><line x1="38" y1="45" x2="38" y2="190" stroke="#536371"/>
      <path d="M38 65C75 125 105 144 242 166" fill="none" stroke="#80b8b0" stroke-width="3"/><path d="M38 65C80 105 115 129 242 148" fill="none" stroke="#d4a75c" stroke-width="3"/><path d="M38 65C90 86 130 104 242 120" fill="none" stroke="#bd7562" stroke-width="3"/>
      <text x="40" y="214" fill="#9eabb5" font-size="12">steps</text>
    </g>
    <g transform="translate(345 110)">
      <rect width="270" height="228" rx="10" fill="#1d2a34"/><text x="18" y="28" fill="#e7edf0" font-size="17">validation loss</text>
      <line x1="38" y1="190" x2="242" y2="190" stroke="#536371"/><line x1="38" y1="45" x2="38" y2="190" stroke="#536371"/>
      <path d="M38 70C82 100 120 125 242 174" fill="none" stroke="#80b8b0" stroke-width="3"/><path d="M38 70C82 110 125 126 242 116" fill="none" stroke="#d4a75c" stroke-width="3"/><path d="M38 70C85 91 130 90 242 155" fill="none" stroke="#bd7562" stroke-width="3"/>
      <text x="40" y="214" fill="#9eabb5" font-size="12">steps</text>
    </g>
    <g transform="translate(644 110)">
      <rect width="270" height="228" rx="10" fill="#1d2a34"/><text x="18" y="28" fill="#e7edf0" font-size="17">parameter norm</text>
      <line x1="38" y1="190" x2="242" y2="190" stroke="#536371"/><line x1="38" y1="45" x2="38" y2="190" stroke="#536371"/>
      <path d="M38 170C90 128 135 85 242 55" fill="none" stroke="#80b8b0" stroke-width="3"/><path d="M38 170C95 140 135 115 242 98" fill="none" stroke="#d4a75c" stroke-width="3"/><path d="M38 170C100 162 150 157 242 151" fill="none" stroke="#bd7562" stroke-width="3"/>
      <text x="40" y="214" fill="#9eabb5" font-size="12">steps</text>
    </g>
    <g font-size="14"><circle cx="185" cy="375" r="5" fill="#80b8b0"/><text x="198" y="380" fill="#e7edf0">WD 0.0</text><circle cx="310" cy="375" r="5" fill="#d4a75c"/><text x="323" y="380" fill="#e7edf0">moderate WD</text><circle cx="485" cy="375" r="5" fill="#bd7562"/><text x="498" y="380" fill="#e7edf0">large WD</text></g>
  </g>
</svg>
