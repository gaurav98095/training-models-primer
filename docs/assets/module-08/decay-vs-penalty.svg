<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Two ways to discourage large weights</title>
  <desc id="desc">A split diagram contrasts L2 regularization, which adds lambda times the parameter to the gradient, with decoupled weight decay, which applies a separate shrinkage step to the parameter.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#9eabb5"/></marker>
  </defs>
  <rect width="960" height="420" fill="#17212b"/>
  <text x="52" y="48" fill="#e7edf0" font-family="sans-serif" font-size="25" font-weight="700">Same goal, different place in the update</text>
  <text x="52" y="76" fill="#9eabb5" font-family="sans-serif" font-size="16">The distinction matters once the optimizer transforms gradients adaptively.</text>
  <g font-family="sans-serif">
    <rect x="48" y="112" width="408" height="250" rx="14" fill="#263541" stroke="#b4a6d8" stroke-width="2"/>
    <text x="76" y="151" fill="#b4a6d8" font-size="21" font-weight="700">L2 penalty · coupled</text>
    <rect x="76" y="180" width="158" height="58" rx="9" fill="#1d2a34" stroke="#80b8b0" stroke-width="2"/>
    <text x="155" y="205" text-anchor="middle" fill="#e7edf0" font-size="17">task loss</text>
    <text x="155" y="226" text-anchor="middle" fill="#9eabb5" font-size="15">+ λ‖θ‖² / 2</text>
    <path d="M234 209H292" stroke="#9eabb5" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="300" y="180" width="126" height="58" rx="9" fill="#1d2a34" stroke="#bd7562" stroke-width="2"/>
    <text x="363" y="205" text-anchor="middle" fill="#e7edf0" font-size="17">gradient</text>
    <text x="363" y="226" text-anchor="middle" fill="#9eabb5" font-size="15">g + λθ</text>
    <text x="76" y="286" fill="#e7edf0" font-size="16">The penalty becomes part of the</text>
    <text x="76" y="309" fill="#e7edf0" font-size="16">gradient seen by Adam's moments.</text>
    <text x="76" y="341" fill="#9eabb5" font-size="14">Equivalent to decay for plain SGD.</text>
    <rect x="504" y="112" width="408" height="250" rx="14" fill="#263541" stroke="#d4a75c" stroke-width="2"/>
    <text x="532" y="151" fill="#d4a75c" font-size="21" font-weight="700">AdamW · decoupled</text>
    <rect x="532" y="180" width="132" height="58" rx="9" fill="#1d2a34" stroke="#80b8b0" stroke-width="2"/>
    <text x="598" y="205" text-anchor="middle" fill="#e7edf0" font-size="17">task gradient</text>
    <text x="598" y="226" text-anchor="middle" fill="#9eabb5" font-size="15">g only</text>
    <path d="M664 209H719" stroke="#9eabb5" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="727" y="180" width="150" height="58" rx="9" fill="#1d2a34" stroke="#d4a75c" stroke-width="2"/>
    <text x="802" y="205" text-anchor="middle" fill="#e7edf0" font-size="17">Adam step</text>
    <text x="802" y="226" text-anchor="middle" fill="#9eabb5" font-size="15">then θ ← (1−ηλ)θ</text>
    <text x="532" y="286" fill="#e7edf0" font-size="16">The shrinkage is a separate parameter</text>
    <text x="532" y="309" fill="#e7edf0" font-size="16">operation, outside moment estimates.</text>
    <text x="532" y="341" fill="#9eabb5" font-size="14">Easier to reason about with Adam.</text>
  </g>
</svg>
