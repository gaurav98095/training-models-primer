<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
  <title id="title">From dataset to optimizer steps</title>
  <desc id="desc">A dataset of ten thousand sequences divided into batches of twenty produces five hundred optimizer steps per epoch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#1c2632"/><stop offset="1" stop-color="#202b38"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7fa7a7"/></marker>
  </defs>
  <rect width="1400" height="410" rx="28" fill="url(#bg)"/>
  <text x="70" y="58" fill="#e4e7e8" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">How an epoch becomes optimizer steps</text>
  <text x="70" y="90" fill="#aeb8bc" font-family="Inter,Arial,sans-serif" font-size="17">One optimizer step usually consumes one batch, unless gradient accumulation changes the schedule.</text>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(70 145)"><rect width="300" height="150" rx="22" fill="#263843" stroke="#628f96" stroke-width="2"/><text x="150" y="52" fill="#e4e7e8" font-size="22" font-weight="700">Dataset</text><text x="150" y="100" fill="#b8c5c9" font-family="ui-monospace,monospace" font-size="28">10,000</text><text x="150" y="128" fill="#b0bcc0" font-size="16">training sequences</text></g>
    <g transform="translate(470 145)"><rect width="300" height="150" rx="22" fill="#414354" stroke="#8b819c" stroke-width="2"/><text x="150" y="52" fill="#e4e7e8" font-size="22" font-weight="700">Batches</text><text x="150" y="100" fill="#cfc3d0" font-family="ui-monospace,monospace" font-size="28">20</text><text x="150" y="128" fill="#b9b5c0" font-size="16">sequences per batch</text></g>
    <g transform="translate(870 145)"><rect width="300" height="150" rx="22" fill="#51463b" stroke="#b59a69" stroke-width="2"/><text x="150" y="52" fill="#e4e7e8" font-size="22" font-weight="700">Optimizer steps</text><text x="150" y="100" fill="#d0bd91" font-family="ui-monospace,monospace" font-size="28">500</text><text x="150" y="128" fill="#c2ab91" font-size="16">per epoch</text></g>
  </g>
  <path d="M380 220 H460 M780 220 H860" stroke="#7fa7a7" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="700" y="350" fill="#b59a69" font-family="ui-monospace,monospace" font-size="20" text-anchor="middle">10,000 ÷ 20 = 500</text>
</svg>
