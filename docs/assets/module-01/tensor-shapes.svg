<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" viewBox="0 0 1400 390" role="img" aria-labelledby="title desc">
  <title id="title">Tensor shapes in a tiny causal language model</title>
  <desc id="desc">Token IDs with shape B by T become embeddings and hidden states with shape B by T by D, then logits with shape B by T by V, which are flattened for cross entropy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#1c2632"/><stop offset="1" stop-color="#202b38"/></linearGradient>
    <linearGradient id="box" x1="0" x2="1"><stop stop-color="#334850"/><stop offset="1" stop-color="#3e4655"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7fa7a7"/></marker>
  </defs>
  <rect width="1400" height="390" rx="28" fill="url(#bg)"/>
  <text x="70" y="58" fill="#e4e7e8" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Shape bookkeeping for next-token prediction</text>
  <text x="70" y="88" fill="#aeb8bc" font-family="Inter,Arial,sans-serif" font-size="17">B = batch size · T = sequence length · D = hidden size · V = vocabulary size</text>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(70 145)"><rect width="220" height="130" rx="18" fill="url(#box)" stroke="#628f96" stroke-width="2"/><text x="110" y="40" fill="#e4e7e8" font-size="20" font-weight="700">Token IDs</text><text x="110" y="80" fill="#b8c5c9" font-family="ui-monospace,monospace" font-size="22">[B, T]</text><text x="110" y="108" fill="#a8c5df" font-size="14">integer indices</text></g>
    <g transform="translate(350 145)"><rect width="220" height="130" rx="18" fill="url(#box)" stroke="#8790a0" stroke-width="2"/><text x="110" y="40" fill="#e4e7e8" font-size="20" font-weight="700">Embeddings</text><text x="110" y="80" fill="#d6ddff" font-family="ui-monospace,monospace" font-size="22">[B, T, D]</text><text x="110" y="108" fill="#b8bdc5" font-size="14">dense representations</text></g>
    <g transform="translate(630 145)"><rect width="220" height="130" rx="18" fill="url(#box)" stroke="#8b819c" stroke-width="2"/><text x="110" y="40" fill="#e4e7e8" font-size="20" font-weight="700">Hidden states</text><text x="110" y="80" fill="#cfc3d0" font-family="ui-monospace,monospace" font-size="22">[B, T, D]</text><text x="110" y="108" fill="#c1b7c8" font-size="14">contextual features</text></g>
    <g transform="translate(910 145)"><rect width="220" height="130" rx="18" fill="url(#box)" stroke="#ffad75" stroke-width="2"/><text x="110" y="40" fill="#e4e7e8" font-size="20" font-weight="700">Logits</text><text x="110" y="80" fill="#c2ab91" font-family="ui-monospace,monospace" font-size="22">[B, T, V]</text><text x="110" y="108" fill="#c2ab91" font-size="14">one score per token</text></g>
    <g transform="translate(1190 145)"><rect width="150" height="130" rx="18" fill="#51463b" stroke="#b59a69" stroke-width="2"/><text x="75" y="40" fill="#e4e7e8" font-size="18" font-weight="700">Cross-entropy</text><text x="75" y="80" fill="#d0bd91" font-family="ui-monospace,monospace" font-size="21">scalar</text><text x="75" y="108" fill="#c2ab91" font-size="14">loss</text></g>
  </g>
  <g stroke="#7fa7a7" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M290 210 H340"/><path d="M570 210 H620"/><path d="M850 210 H900"/><path d="M1130 210 H1180"/></g>
  <text x="700" y="330" fill="#b0bcc0" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">For cross-entropy, logits are reshaped to [B×T, V] and targets to [B×T].</text>
</svg>
