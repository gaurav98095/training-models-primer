<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" viewBox="0 0 1400 390" role="img" aria-labelledby="title desc">
  <title id="title">Tensor shapes in a tiny causal language model</title>
  <desc id="desc">Token IDs with shape B by T become embeddings and hidden states with shape B by T by D, then logits with shape B by T by V, which are flattened for cross entropy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0a1730"/><stop offset="1" stop-color="#18214c"/></linearGradient>
    <linearGradient id="box" x1="0" x2="1"><stop stop-color="#1b4a6b"/><stop offset="1" stop-color="#30306b"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#99e3ff"/></marker>
  </defs>
  <rect width="1400" height="390" rx="28" fill="url(#bg)"/>
  <text x="70" y="58" fill="#f3f7ff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Shape bookkeeping for next-token prediction</text>
  <text x="70" y="88" fill="#a8b9d9" font-family="Inter,Arial,sans-serif" font-size="17">B = batch size · T = sequence length · D = hidden size · V = vocabulary size</text>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(70 145)"><rect width="220" height="130" rx="18" fill="url(#box)" stroke="#43d9ff" stroke-width="2"/><text x="110" y="40" fill="#fff" font-size="20" font-weight="700">Token IDs</text><text x="110" y="80" fill="#bceeff" font-family="ui-monospace,monospace" font-size="22">[B, T]</text><text x="110" y="108" fill="#a8c5df" font-size="14">integer indices</text></g>
    <g transform="translate(350 145)"><rect width="220" height="130" rx="18" fill="url(#box)" stroke="#6d9cff" stroke-width="2"/><text x="110" y="40" fill="#fff" font-size="20" font-weight="700">Embeddings</text><text x="110" y="80" fill="#d6ddff" font-family="ui-monospace,monospace" font-size="22">[B, T, D]</text><text x="110" y="108" fill="#b4c0e5" font-size="14">dense representations</text></g>
    <g transform="translate(630 145)"><rect width="220" height="130" rx="18" fill="url(#box)" stroke="#a77dff" stroke-width="2"/><text x="110" y="40" fill="#fff" font-size="20" font-weight="700">Hidden states</text><text x="110" y="80" fill="#eadcff" font-family="ui-monospace,monospace" font-size="22">[B, T, D]</text><text x="110" y="108" fill="#cdb9e8" font-size="14">contextual features</text></g>
    <g transform="translate(910 145)"><rect width="220" height="130" rx="18" fill="url(#box)" stroke="#ffad75" stroke-width="2"/><text x="110" y="40" fill="#fff" font-size="20" font-weight="700">Logits</text><text x="110" y="80" fill="#ffe0c7" font-family="ui-monospace,monospace" font-size="22">[B, T, V]</text><text x="110" y="108" fill="#e9c8ae" font-size="14">one score per token</text></g>
    <g transform="translate(1190 145)"><rect width="150" height="130" rx="18" fill="#45332a" stroke="#ffd27c" stroke-width="2"/><text x="75" y="40" fill="#fff" font-size="18" font-weight="700">Cross-entropy</text><text x="75" y="80" fill="#ffe2a7" font-family="ui-monospace,monospace" font-size="21">scalar</text><text x="75" y="108" fill="#e9cda2" font-size="14">loss</text></g>
  </g>
  <g stroke="#99e3ff" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M290 210 H340"/><path d="M570 210 H620"/><path d="M850 210 H900"/><path d="M1130 210 H1180"/></g>
  <text x="700" y="330" fill="#b7c9e7" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">For cross-entropy, logits are reshaped to [B×T, V] and targets to [B×T].</text>
</svg>
