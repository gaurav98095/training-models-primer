<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Norm comparison</title><desc id="desc">A common scale compares weight, gradient, and parameter update norms across training steps, with the update norm shown as a smaller fraction.</desc><rect width="1000" height="500" fill="#17212b"/><text x="44" y="48" fill="#e7e1d7" font-family="sans-serif" font-size="24" font-weight="700">Three norms, three questions</text><text x="44" y="76" fill="#a8b3bd" font-family="sans-serif" font-size="14">Use the ratio update norm ÷ weight norm to judge relative motion.</text><path d="M95 415H930M95 125V415" stroke="#536370" stroke-width="2"/><g font-family="sans-serif" font-size="14" fill="#dce2e5"><text x="50" y="130">large</text><text x="55" y="420">small</text><text x="820" y="450">training step</text></g><path d="M100 190 C220 180 330 205 450 190 S700 170 925 160" fill="none" stroke="#c8a66a" stroke-width="5"/><path d="M100 280 L220 270 350 285 470 250 590 265 720 245 925 250" fill="none" stroke="#b89fc8" stroke-width="5"/><path d="M100 380 L220 370 350 375 470 350 590 365 720 355 925 360" fill="none" stroke="#7da9a1" stroke-width="5"/><g font-family="sans-serif" font-size="16" fill="#dce2e5"><rect x="110" y="110" width="18" height="5" fill="#c8a66a"/><text x="138" y="116">weight norm — parameter scale</text><rect x="350" y="110" width="18" height="5" fill="#b89fc8"/><text x="378" y="116">gradient norm — pressure to move</text><rect x="690" y="110" width="18" height="5" fill="#7da9a1"/><text x="718" y="116">update norm — actual motion</text></g></svg>
