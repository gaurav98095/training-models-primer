<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Healthy dashboard signals</title><desc id="desc">Three small trend charts show loss decreasing, gradient norm settling, and update norm remaining a small stable fraction of the weight norm.</desc><rect width="1100" height="560" fill="#17212b"/><text x="48" y="50" fill="#e7e1d7" font-family="sans-serif" font-size="24" font-weight="700">A healthy dashboard is boring</text><text x="48" y="78" fill="#a8b3bd" font-family="sans-serif" font-size="14">Smooth trends matter more than any one batch.</text><g font-family="sans-serif" font-size="15" fill="#dce2e5"><g transform="translate(70 125)"><rect width="290" height="300" rx="8" fill="#202d38" stroke="#536370"/><text x="20" y="32">loss ↓</text><path d="M28 250H260M28 55V250" stroke="#536370"/><path d="M30 75 C80 105 95 145 145 165 S215 215 255 235" fill="none" stroke="#7da9a1" stroke-width="5"/></g><g transform="translate(405 125)"><rect width="290" height="300" rx="8" fill="#202d38" stroke="#536370"/><text x="20" y="32">gradient norm</text><path d="M28 250H260M28 55V250" stroke="#536370"/><path d="M30 150 L70 100 105 180 145 135 185 160 225 145 255 150" fill="none" stroke="#b89fc8" stroke-width="5"/></g><g transform="translate(740 125)"><rect width="290" height="300" rx="8" fill="#202d38" stroke="#536370"/><text x="20" y="32">update / weight</text><path d="M28 250H260M28 55V250" stroke="#536370"/><path d="M30 175 L80 170 130 172 180 168 230 170 255 169" fill="none" stroke="#c8a66a" stroke-width="5"/></g></g><text x="70" y="485" fill="#a8b3bd" font-family="sans-serif" font-size="15">Healthy does not mean flat: it means changes are bounded, explainable, and coupled to progress.</text></svg>
