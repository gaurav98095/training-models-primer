<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">Training debugging scenarios</title><desc id="desc">A four-card diagnostic map links a visible symptom to likely signals and a first inspection: spike, no learning, overfitting, and GPU bottleneck.</desc><rect width="1100" height="570" fill="#17212b"/><text x="48" y="50" fill="#e7e1d7" font-family="sans-serif" font-size="24" font-weight="700">Symptom → signals → first inspection</text><text x="48" y="78" fill="#a8b3bd" font-family="sans-serif" font-size="14">Start with measurements that can distinguish competing explanations.</text><g font-family="sans-serif"><g transform="translate(55 120)"><rect width="470" height="165" rx="8" fill="#202d38" stroke="#b66f62" stroke-width="2"/><text x="22" y="34" fill="#e7e1d7" font-size="18" font-weight="700">Spike</text><text x="22" y="66" fill="#dce2e5" font-size="14">loss or gradient jumps suddenly</text><text x="22" y="102" fill="#a8b3bd" font-size="14">Check: batch contents, LR, non-finite values</text><text x="22" y="135" fill="#c8a66a" font-size="14">first probe: log batch + gradient norm</text></g><g transform="translate(575 120)"><rect width="470" height="165" rx="8" fill="#202d38" stroke="#b89fc8" stroke-width="2"/><text x="22" y="34" fill="#e7e1d7" font-size="18" font-weight="700">No learning</text><text x="22" y="66" fill="#dce2e5" font-size="14">loss and update stay almost unchanged</text><text x="22" y="102" fill="#a8b3bd" font-size="14">Check: gradients, frozen params, optimizer step</text><text x="22" y="135" fill="#c8a66a" font-size="14">first probe: compare update / weight</text></g><g transform="translate(55 335)"><rect width="470" height="165" rx="8" fill="#202d38" stroke="#c8a66a" stroke-width="2"/><text x="22" y="34" fill="#e7e1d7" font-size="18" font-weight="700">Overfitting</text><text x="22" y="66" fill="#dce2e5" font-size="14">training improves; validation worsens</text><text x="22" y="102" fill="#a8b3bd" font-size="14">Check: train/validation split and gap</text><text x="22" y="135" fill="#c8a66a" font-size="14">first probe: plot both curves</text></g><g transform="translate(575 335)"><rect width="470" height="165" rx="8" fill="#202d38" stroke="#7da9a1" stroke-width="2"/><text x="22" y="34" fill="#e7e1d7" font-size="18" font-weight="700">GPU bottleneck</text><text x="22" y="66" fill="#dce2e5" font-size="14">memory or throughput limits progress</text><text x="22" y="102" fill="#a8b3bd" font-size="14">Check: allocated/reserved, utilization, input wait</text><text x="22" y="135" fill="#c8a66a" font-size="14">first probe: memory timeline + step time</text></g></g></svg>
