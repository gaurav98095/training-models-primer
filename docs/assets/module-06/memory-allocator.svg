<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">GPU memory allocator view</title><desc id="desc">A stacked memory bar distinguishes live allocated tensors, cached reserved blocks, and memory outside the framework such as kernels and communication buffers.</desc><rect width="1100" height="520" fill="#17212b"/><text x="48" y="50" fill="#e7e1d7" font-family="sans-serif" font-size="24" font-weight="700">What “GPU memory” can mean</text><text x="48" y="78" fill="#a8b3bd" font-family="sans-serif" font-size="14">Allocated is live; reserved is held by the allocator; outside memory is still real.</text><g transform="translate(120 150)"><rect width="760" height="100" rx="8" fill="#263440" stroke="#536370" stroke-width="2"/><rect width="360" height="100" rx="8" fill="#7da9a1"/><rect x="360" width="240" height="100" fill="#c8a66a"/><rect x="600" width="160" height="100" rx="8" fill="#b66f62"/><g font-family="sans-serif" font-size="16" fill="#17212b" text-anchor="middle"><text x="180" y="58">allocated</text><text x="480" y="58">reserved, free blocks</text><text x="680" y="58">outside</text></g></g><g font-family="sans-serif" font-size="16" fill="#dce2e5"><text x="120" y="300">Allocated</text><text x="120" y="326" fill="#a8b3bd">Live tensors, gradients, optimizer state.</text><text x="120" y="372">Reserved</text><text x="120" y="398" fill="#a8b3bd">Cached blocks kept by the framework for reuse.</text><text x="120" y="444">Outside allocator</text><text x="120" y="470" fill="#a8b3bd">Kernels, NCCL buffers, CUDA context, and other consumers.</text></g></svg>
