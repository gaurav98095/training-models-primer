<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Monitored training step</title><desc id="desc">A left-to-right sequence shows clearing gradients, forward pass, backward pass, measuring signals, clipping, updating parameters, and recording metrics.</desc><rect width="1200" height="430" fill="#17212b"/><text x="48" y="52" fill="#e7e1d7" font-family="sans-serif" font-size="24" font-weight="700">Instrument the step without changing its meaning</text><path d="M115 220H1080" stroke="#536370" stroke-width="4"/>
<g font-family="sans-serif" text-anchor="middle"><g fill="#202d38" stroke="#7da9a1" stroke-width="2"><circle cx="115" cy="220" r="52"/><circle cx="275" cy="220" r="52"/><circle cx="435" cy="220" r="52"/></g><g fill="#202d38" stroke="#b89fc8" stroke-width="2"><circle cx="595" cy="220" r="52"/><circle cx="755" cy="220" r="52"/></g><g fill="#202d38" stroke="#c8a66a" stroke-width="2"><circle cx="915" cy="220" r="52"/><circle cx="1075" cy="220" r="52"/></g><g fill="#dce2e5" font-size="15"><text x="115" y="216">clear</text><text x="115" y="237">gradients</text><text x="275" y="216">forward</text><text x="435" y="216">backward</text><text x="595" y="216">measure</text><text x="755" y="216">clip</text><text x="915" y="216">update</text><text x="1075" y="216">metrics</text></g><g fill="#a8b3bd" font-size="13"><text x="115" y="315">reset buffers</text><text x="275" y="315">loss</text><text x="435" y="315">gradients</text><text x="595" y="315">norms + memory</text><text x="755" y="315">optional safety</text><text x="915" y="315">optimizer step</text><text x="1075" y="315">log + inspect</text></g></g></svg>
