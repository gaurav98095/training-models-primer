<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" role="img" aria-labelledby="title desc"><title id="title">First abnormal step debugging checklist</title><desc id="desc">A six-step sequence records the first bad step, compares batch and fixed losses, checks gradients, parameters, and numerical values, then isolates the smallest change.</desc><rect width="980" height="360" fill="#18202b"/><style>text{font-family:Inter,Arial,sans-serif;fill:#e4e7eb}.sub{fill:#aeb7c2;font-size:14px}.box{fill:#222d3a;stroke:#647181;stroke-width:2}.num{fill:#c6a66a}</style><text x="40" y="45" font-size="26" font-weight="700">Investigate the first abnormal step</text><g transform="translate(35 100)"><g><circle class="num" cx="35" cy="35" r="25"/><text x="29" y="42" fill="#18202b">1</text><rect class="box" x="75" width="130" height="72" rx="6"/><text x="90" y="30">Record step</text><text x="90" y="53" class="sub">inputs + seed</text></g><g transform="translate(160)"><circle class="num" cx="35" cy="35" r="25"/><text x="29" y="42" fill="#18202b">2</text><rect class="box" x="75" width="130" height="72" rx="6"/><text x="90" y="30">Replay batch</text><text x="90" y="53" class="sub">fixed examples</text></g><g transform="translate(320)"><circle class="num" cx="35" cy="35" r="25"/><text x="29" y="42" fill="#18202b">3</text><rect class="box" x="75" width="130" height="72" rx="6"/><text x="90" y="30">Check grads</text><text x="90" y="53" class="sub">norm + finite</text></g><g transform="translate(480)"><circle class="num" cx="35" cy="35" r="25"/><text x="29" y="42" fill="#18202b">4</text><rect class="box" x="75" width="130" height="72" rx="6"/><text x="90" y="30">Check params</text><text x="90" y="53" class="sub">delta + finite</text></g><g transform="translate(640)"><circle class="num" cx="35" cy="35" r="25"/><text x="29" y="42" fill="#18202b">5</text><rect class="box" x="75" width="130" height="72" rx="6"/><text x="90" y="30">Check logits</text><text x="90" y="53" class="sub">range + scale</text></g></g><rect class="box" x="300" y="245" width="380" height="62" rx="6"/><text x="330" y="273">6  Isolate the smallest change</text><text x="330" y="295" class="sub">LR, batch, precision, data, or optimizer state</text></svg>
