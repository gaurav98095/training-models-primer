<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc"><title id="title">Training failure chain</title><desc id="desc">A too-large learning rate can create oversized updates, extreme activations or logits, abnormal loss, and unusable gradients.</desc><rect width="1100" height="300" fill="#18202b"/><style>text{font-family:Inter,Arial,sans-serif;fill:#e4e7eb}.sub{fill:#aeb7c2;font-size:15px}.box{fill:#222d3a;stroke:#647181;stroke-width:2}.arrow{stroke:#a69abb;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a69abb" stroke-width="2"/></marker></defs><text x="40" y="48" font-size="26" font-weight="700">Trace the first abnormal state</text><g transform="translate(30 105)"><g><rect class="box" width="160" height="95"/><text x="18" y="35">Learning rate</text><text x="18" y="62" class="sub">too large</text></g><g transform="translate(190)"><rect class="box" width="160" height="95"/><text x="18" y="35">Parameter</text><text x="18" y="62" class="sub">update jumps</text></g><g transform="translate(380)"><rect class="box" width="190" height="95"/><text x="18" y="35">Activations / logits</text><text x="18" y="62" class="sub">extreme values</text></g><g transform="translate(600)"><rect class="box" width="160" height="95"/><text x="18" y="35">Loss</text><text x="18" y="62" class="sub">spike or NaN</text></g><g transform="translate(790)"><rect class="box" width="180" height="95"/><text x="18" y="35">Gradients</text><text x="18" y="62" class="sub">explode / vanish</text></g><path class="arrow" d="M160 48H185"/><path class="arrow" d="M350 48H375"/><path class="arrow" d="M570 48H595"/><path class="arrow" d="M760 48H785"/></g></svg>
