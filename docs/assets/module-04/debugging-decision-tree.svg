<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">Loss spike debugging decision tree</title><desc id="desc">After a spike, compare a fixed diagnostic loss. If it is also abnormal inspect model state and data; otherwise inspect the current batch.</desc><rect width="1000" height="470" fill="#18202b"/><style>text{font-family:Inter,Arial,sans-serif;fill:#e4e7eb}.sub{fill:#aeb7c2;font-size:15px}.node{fill:#222d3a;stroke:#647181;stroke-width:2}.yes{stroke:#70aaa5;stroke-width:3;fill:none}.no{stroke:#c6a66a;stroke-width:3;fill:none}.label{font-size:16px;font-weight:700}</style><text x="40" y="45" font-size="26" font-weight="700">A small decision tree for a loss spike</text><rect class="node" x="370" y="80" width="260" height="70" rx="8"/><text x="410" y="112">Loss spikes</text><text x="410" y="136" class="sub">record step and inputs</text><path class="yes" d="M500 150V205"/><rect class="node" x="340" y="205" width="320" height="75" rx="8"/><text x="380" y="238">Does fixed-batch loss spike too?</text><text x="380" y="262" class="sub">same examples, no data noise</text><path class="yes" d="M340 242H175V350"/><text x="210" y="230" class="label" fill="#70aaa5">YES</text><path class="no" d="M660 242H825V350"/><text x="735" y="230" class="label" fill="#c6a66a">NO</text><rect class="node" x="45" y="350" width="260" height="70" rx="8"/><text x="78" y="382">Inspect model / state</text><text x="78" y="405" class="sub">LR, gradients, params, precision</text><rect class="node" x="695" y="350" width="260" height="70" rx="8"/><text x="728" y="382">Inspect current batch</text><text x="728" y="405" class="sub">data, labels, masks, sampler</text></svg>
