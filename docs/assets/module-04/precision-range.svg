<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">FP16 and BF16 exponent and precision comparison</title><desc id="desc">FP16 and BF16 both use 16 bits, but BF16 keeps the FP32 exponent width while FP16 has more fraction bits.</desc><rect width="1000" height="390" fill="#18202b"/><style>text{font-family:Inter,Arial,sans-serif;fill:#e4e7eb}.sub{fill:#aeb7c2;font-size:16px}.bar{stroke:#647181;stroke-width:2}.exp{fill:#70aaa5}.frac{fill:#a69abb}.sign{fill:#c6a66a}.call{fill:#222d3a;stroke:#647181}</style><text x="40" y="45" font-size="26" font-weight="700">Same storage size, different numerical trade-off</text><text x="40" y="72" class="sub">Exponent width controls range; fraction width controls significand precision.</text><text x="55" y="135" font-size="20">FP16</text><rect class="sign" x="150" y="105" width="55" height="54"/><rect class="exp" x="205" y="105" width="220" height="54"/><rect class="frac" x="425" y="105" width="430" height="54"/><text x="168" y="138">S</text><text x="300" y="138">5-bit exponent</text><text x="585" y="138">10-bit fraction</text><text x="55" y="235" font-size="20">BF16</text><rect class="sign" x="150" y="205" width="55" height="54"/><rect class="exp" x="205" y="205" width="350" height="54"/><rect class="frac" x="555" y="205" width="300" height="54"/><text x="168" y="238">S</text><text x="310" y="238">8-bit exponent</text><text x="620" y="238">7-bit fraction</text><rect class="call" x="55" y="300" width="800" height="48" rx="6"/><text x="75" y="330" class="sub">FP16: more fraction precision, narrower range  ·  BF16: wider range, less fraction precision</text></svg>
