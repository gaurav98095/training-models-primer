<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Batch loss versus model diagnostic loss</title><desc id="desc">A noisy current-batch loss is compared with a fixed diagnostic batch that reveals model progress.</desc><rect width="960" height="420" fill="#18202b"/><style>text{font-family:Inter,Arial,sans-serif;fill:#e4e7eb}.sub{fill:#aeb7c2;font-size:16px}.axis{stroke:#647181;stroke-width:2}.grid{stroke:#34404e}.line{fill:none;stroke-width:5;stroke-linecap:round}.teal{stroke:#70aaa5}.lav{stroke:#a69abb}</style><text x="42" y="48" font-size="26" font-weight="700">Separate batch noise from model behavior</text><text x="42" y="76" class="sub">Evaluate the same fixed examples periodically while training continues on fresh batches.</text><path class="axis" d="M90 330V110M90 330H875"/><path class="grid" d="M90 170H875M90 250H875"/><path class="line teal" d="M100 245L135 180L170 275L205 215L240 260L275 165L310 245L345 210L380 225L415 155L450 230L485 190L520 215L555 145L590 205L625 175L660 195L695 135L730 180L765 155L800 165L850 125"/><path class="line lav" d="M100 280C210 270 280 250 380 225S560 190 680 160S790 135 850 120"/><text x="105" y="365" class="sub">step</text><text x="110" y="125" fill="#70aaa5">fresh batches: noisy</text><text x="610" y="105" fill="#a69abb">fixed diagnostic batch: comparable</text><rect x="680" y="275" width="220" height="55" fill="#222d3a" stroke="#647181"/><text x="695" y="298" class="sub">If fixed loss rises too:</text><text x="695" y="320">inspect the model/state.</text></svg>
