<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
<title id="title">Common training loss patterns</title><desc id="desc">Six small plots show healthy decline, a spike, divergence, plateau, oscillation, and non-finite loss.</desc>
<rect width="960" height="620" fill="#18202b"/><style>text{font-family:Inter,Arial,sans-serif;fill:#e4e7eb} .sub{fill:#aeb7c2;font-size:16px}.axis{stroke:#647181;stroke-width:2}.grid{stroke:#34404e;stroke-width:1}.teal{stroke:#70aaa5}.lav{stroke:#a69abb}.ochre{stroke:#c6a66a}.rust{stroke:#b87568}.line{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
<text x="40" y="44" font-size="26" font-weight="700">Loss patterns are evidence</text><text x="40" y="70" class="sub">Read the shape, then locate the first step where it changed.</text>
<g transform="translate(40 105)"><g transform="translate(0 0)"><text x="0" y="0" font-size="19">Healthy decline</text><path class="axis" d="M0 180V20M0 180H260"/><path class="grid" d="M0 80H260M0 130H260"/><path class="line teal" d="M10 35C55 65 85 90 125 120s70 40 125 45"/><text x="0" y="210" class="sub">steady improvement</text></g>
<g transform="translate(320 0)"><text x="0" y="0" font-size="19">Spike</text><path class="axis" d="M0 180V20M0 180H260"/><path class="grid" d="M0 80H260M0 130H260"/><path class="line rust" d="M10 140L70 130L115 35L145 145L205 150L250 155"/><text x="0" y="210" class="sub">sudden instability</text></g>
<g transform="translate(640 0)"><text x="0" y="0" font-size="19">Divergence</text><path class="axis" d="M0 180V20M0 180H260"/><path class="grid" d="M0 80H260M0 130H260"/><path class="line rust" d="M10 150C70 145 100 130 130 105S210 45 250 22"/><text x="0" y="210" class="sub">updates run away</text></g>
<g transform="translate(0 280)"><text x="0" y="0" font-size="19">Plateau</text><path class="axis" d="M0 180V20M0 180H260"/><path class="grid" d="M0 80H260M0 130H260"/><path class="line ochre" d="M10 35C45 110 85 140 130 145L250 146"/><text x="0" y="210" class="sub">progress stalls</text></g>
<g transform="translate(320 280)"><text x="0" y="0" font-size="19">Oscillation</text><path class="axis" d="M0 180V20M0 180H260"/><path class="grid" d="M0 80H260M0 130H260"/><path class="line lav" d="M10 110Q35 35 60 110T110 110T160 110T210 110T250 110"/><text x="0" y="210" class="sub">overshooting basin</text></g>
<g transform="translate(640 280)"><text x="0" y="0" font-size="19">Non-finite</text><path class="axis" d="M0 180V20M0 180H260"/><path class="grid" d="M0 80H260M0 130H260"/><path class="line rust" d="M10 145L75 140L120 130L150 80L175 25"/><path stroke="#b87568" stroke-width="3" d="M190 20v160" stroke-dasharray="7 7"/><text x="195" y="50" class="sub">NaN / inf</text><text x="0" y="210" class="sub">numerical failure</text></g></g></svg>
